version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: banking_postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - banking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: banking_redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # HashiCorp Vault pour la gestion des secrets
  vault:
    image: vault:1.15
    container_name: banking_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: vault_token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - banking_network
    command: vault server -dev -dev-root-token-id=vault_token
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_backend
    environment:
      # Base de données
      DATABASE_URL: postgresql://banking_user:banking_password@postgres:5432/banking
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 30
      
      # Sécurité
      SECRET_KEY: your-super-secret-key-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # Vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: vault_token
      VAULT_MOUNT_POINT: secret
      
      # SWIFT (mode dry-run)
      SWIFT_BIC: YOURBIC
      SWIFT_CERT_PATH: /app/certs/swift.crt
      SWIFT_KEY_PATH: /app/certs/swift.key
      SWIFT_ENDPOINT: https://swift.example.com
      SWIFT_DRY_RUN: "true"
      SWIFT_TIMEOUT: 30
      
      # Mojaloop (mode dry-run)
      MOJALOOP_ENDPOINT: https://mojaloop.example.com
      MOJALOOP_DRY_RUN: "true"
      MOJALOOP_TIMEOUT: 30
      
      # Redis
      REDIS_URL: redis://:redis_password@redis:6379/0
      
      # Notifications
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      
      # Monitoring
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      PROMETHEUS_PORT: 9090
      
      # KYC
      KYC_MAX_TRANSFER_AMOUNT: 10000.0
      KYC_MAX_DAILY_AMOUNT: 50000.0
      DOCUMENT_STORAGE_PATH: /app/uploads
      
      # Application
      APP_NAME: Banking Transfer Platform
      APP_VERSION: 1.0.0
      DEBUG: "false"
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking_frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000/ws
      REACT_APP_ENVIRONMENT: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus pour le monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: banking_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - banking_network
    depends_on:
      - backend

  # Grafana pour les dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: banking_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - banking_network
    depends_on:
      - prometheus

  # Nginx pour le reverse proxy
  nginx:
    image: nginx:alpine
    container_name: banking_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - banking_network

  # Keycloak pour l'authentification
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: banking_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch pour les logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: banking_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - banking_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana pour la visualisation des logs
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: banking_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - banking_network

  # Filebeat pour la collecte de logs
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: banking_filebeat
    user: root
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - banking_network

volumes:
  postgres_data:
  redis_data:
  vault_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  banking_network:
    driver: bridge