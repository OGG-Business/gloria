name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
      - name: Lint
        run: |
          pip install ruff
          ruff check backend
      - name: Tests
        run: |
          pip install pytest pytest-asyncio coverage
          pytest -q
  docker-build:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend:ci -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build -t frontend:ci frontend