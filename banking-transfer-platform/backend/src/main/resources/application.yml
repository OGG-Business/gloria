spring:
  profiles:
    active: dev
  
  # Configuration de la base de données
  datasource:
    url: jdbc:postgresql://localhost:5432/banking_transfers
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Configuration JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Configuration Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Configuration Redis
  redis:
    host: localhost
    port: 6379
    password: redis_password
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Configuration Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: banking-transfer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  # Configuration Vault
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: vault_token
      fail-fast: false

# Configuration du serveur
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Configuration des endpoints de gestion
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Configuration du logging
logging:
  level:
    com.banking.transfers: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 100MB
    max-history: 30

# Configuration JWT
jwt:
  secret: your-256-bit-secret-key-here-change-in-production
  expiration: 86400000 # 24 heures
  refresh-expiration: 604800000 # 7 jours
  issuer: banking-transfer-platform

# Configuration Keycloak
keycloak:
  auth-server-url: http://localhost:8081
  realm: banking
  client-id: banking-client
  client-secret: client-secret
  admin:
    username: admin
    password: admin

# Configuration SWIFT
swift:
  enabled: false
  test-mode: true
  endpoint: https://test.swift.com
  bic: TESTBICX
  certificate-path: /certs/swift.p12
  certificate-password: ${SWIFT_CERT_PASSWORD:}
  timeout: 30000

# Configuration Mojaloop
mojaloop:
  enabled: false
  test-mode: true
  endpoint: https://test.mojaloop.io
  participant-id: test-participant
  timeout: 30000

# Configuration de sécurité
security:
  mfa:
    enabled: true
    issuer: BankingTransferPlatform
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-numbers: true
    require-special-chars: true
  session:
    timeout: 3600
  ip-blocking:
    enabled: true
    max-attempts: 5
    block-duration: 3600

# Configuration KYC
kyc:
  auto-verification:
    enabled: true
    max-amount: 10000
  sanctions-screening:
    enabled: true

# Configuration des transferts
transfer:
  limits:
    daily: 50000
    monthly: 500000
    single: 10000
  fees:
    swift: 25.00
    mojaloop: 5.00
    sepa: 3.00
    default: 10.00

# Configuration des notifications
notification:
  email:
    enabled: true
    from: noreply@banking-transfer-platform.com
  sms:
    enabled: false
  webhook:
    enabled: true

# Configuration de l'audit
audit:
  enabled: true
  log-level: INFO
  retention-days: 90

# Configuration CORS
cors:
  allowed-origins: http://localhost:3000,http://localhost:8080
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600