# SwiftPay Production Helm Values

global:
  environment: production
  domain: swiftpay.local
  
replicaCount: 3

image:
  repository: ghcr.io/swiftpay/backend
  tag: latest
  pullPolicy: Always

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/swiftpay/frontend
    tag: latest
    pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/swiftpay-service-role

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

service:
  type: ClusterIP
  port: 8080
  managementPort: 8081
  
frontend:
  service:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: swiftpay-tls
      hosts:
        - api.swiftpay.local
        - app.swiftpay.local

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

frontend:
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# External managed services for production
database:
  enabled: false
  host: swiftpay-postgres.database.svc.cluster.local
  port: 5432
  name: swiftpay_prod
  username: swiftpay_user
  
redis:
  enabled: false
  host: swiftpay-redis.cache.svc.cluster.local
  port: 6379

vault:
  enabled: false
  url: https://vault.swiftpay.local:8200

# Storage configuration
storage:
  kycStorageClass: fast-ssd
  logsStorageClass: standard

# Monitoring
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      path: /actuator/prometheus
  grafana:
    enabled: true

# Security
security:
  podSecurityPolicy:
    enabled: true
  networkPolicy:
    enabled: true

# Pod anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - swiftpay
        topologyKey: kubernetes.io/hostname

# Node selection for production workloads
nodeSelector:
  node-type: production

# Tolerations for dedicated nodes
tolerations:
- key: "production-workload"
  operator: "Equal"
  value: "true"
  effect: "NoSchedule"