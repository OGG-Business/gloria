apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swiftpay.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swiftpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "swiftpay.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.backend.service.managementPort }}"
        prometheus.io/path: "/actuator/prometheus"
      labels:
        {{- include "swiftpay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "swiftpay.serviceAccountName" . }}-backend
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-backend
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry | default .Values.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.backend.service.managementPort }}
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Xmx2g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
            - name: SPRING_PROFILES_ACTIVE
              value: "production,docker"
          envFrom:
            - configMapRef:
                name: {{ include "swiftpay.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
            {{- if .Values.persistence.uploads.enabled }}
            - name: app-uploads
              mountPath: /app/uploads
            {{- end }}
            - name: swift-certs
              mountPath: /app/certs/swift
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "swiftpay.fullname" . }}-logs-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.uploads.enabled }}
        - name: app-uploads
          persistentVolumeClaim:
            claimName: {{ include "swiftpay.fullname" . }}-uploads-pvc
        {{- end }}
        - name: swift-certs
          secret:
            secretName: {{ include "swiftpay.fullname" . }}-swift-certs
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}