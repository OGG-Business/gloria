{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swiftpay.serviceAccountName" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swiftpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swiftpay.frontendServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swiftpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}