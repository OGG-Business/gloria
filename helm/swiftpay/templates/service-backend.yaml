apiVersion: v1
kind: Service
metadata:
  name: {{ include "swiftpay.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swiftpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.backend.service.managementPort }}"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.backend.service.managementPort }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "swiftpay.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend