apiVersion: v2
name: swiftpay
description: A Helm chart for SwiftPay - Global Bank Transfer Management System
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/swiftpay/swiftpay
sources:
  - https://github.com/swiftpay/swiftpay
maintainers:
  - name: SwiftPay Team
    email: team@swiftpay.org
keywords:
  - banking
  - payments
  - swift
  - iso20022
  - iban
  - transfers
  - fintech
annotations:
  category: Banking
  licenses: MIT
dependencies:
  - name: postgresql
    version: "^12.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "^18.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled