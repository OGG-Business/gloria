apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-payments-hub.fullname" . }}-frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "open-payments-hub.name" . }}
    tier: frontend
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: 80