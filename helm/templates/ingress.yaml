{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-payments-hub.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: "gce"
{{- if .Values.ingress.tls.enabled }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.tls.secretName }}
{{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "open-payments-hub.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "open-payments-hub.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backendPort }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
{{- end }}
{{- end }}