apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftpay-ingress
  namespace: swiftpay
  labels:
    app: swiftpay
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.swiftpay.example.com https://auth.swiftpay.example.com; frame-ancestors 'none';" always;
spec:
  tls:
  - hosts:
    - swiftpay.example.com
    - api.swiftpay.example.com
    - auth.swiftpay.example.com
    secretName: swiftpay-tls
  rules:
  # Frontend
  - host: swiftpay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: swiftpay-frontend
            port:
              number: 80
  # Backend API
  - host: api.swiftpay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: swiftpay-backend
            port:
              number: 8080
  # Keycloak (if deployed in same namespace)
  - host: auth.swiftpay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080