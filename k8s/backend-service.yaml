apiVersion: v1
kind: Service
metadata:
  name: swiftpay-backend
  namespace: swiftpay
  labels:
    app: swiftpay-backend
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: swiftpay-backend

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: swiftpay-backend
  namespace: swiftpay
  labels:
    app: swiftpay-backend
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: swiftpay-backend
  endpoints:
  - port: management
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s