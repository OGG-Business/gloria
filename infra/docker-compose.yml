version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transfers
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10.17.0
    command: -url=jdbc:postgresql://db:5432/transfers -user=postgres -password=postgres -connectRetries=60 migrate
    volumes:
      - ../db/migrations:/flyway/sql
    depends_on:
      - db

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8081"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"

  vault:
    image: hashicorp/vault:1.16
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  backend:
    build: ../backend
    environment:
      APP_APP_ENV: dev
      APP_AUTH_DISABLED: "true"
      APP_DATABASE_URL: postgresql://postgres:postgres@db:5432/transfers
      APP_DRY_RUN: "true"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - flyway

  frontend:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.5
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  db-data: