apiVersion: v1
kind: Service
metadata:
  name: {{ include "openbank-transfers.fullname" . }}-backend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "openbank-transfers.name" . }}
    tier: backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http