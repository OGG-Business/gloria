apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openbank-transfers.fullname" . }}-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openbank-transfers.fullname" . }}-backend
                port:
                  number: {{ .Values.service.port }}