spring:
  application:
    name: banking-transfer-platform
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/banking_transfers
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: banking-transfer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  vault:
    host: localhost
    port: 8200
    scheme: http
    authentication: TOKEN
    token: ${VAULT_TOKEN:dev-token}
    kv:
      enabled: true
      backend: secret
      application-name: banking-transfer-platform

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,auditevents
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

logging:
  level:
    com.banking.transfers: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/banking-transfer-platform.log
    max-size: 100MB
    max-history: 30

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  expiration: 86400 # 24 hours
  refresh-expiration: 604800 # 7 days
  password-reset:
    expiration: 1800 # 30 minutes
  issuer: banking-transfer-platform

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:banking-transfer}
  client-id: ${KEYCLOAK_CLIENT_ID:banking-transfer-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:client-secret}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

swift:
  enabled: false
  test-mode: true
  endpoint: ${SWIFT_ENDPOINT:https://test.swift.com}
  bic: ${SWIFT_BIC:TESTBICX}
  certificate-path: ${SWIFT_CERT_PATH:/certs/swift.p12}
  certificate-password: ${SWIFT_CERT_PASSWORD:}
  timeout: 30000

mojaloop:
  enabled: false
  test-mode: true
  endpoint: ${MOJALOOP_ENDPOINT:https://test.mojaloop.io}
  participant-id: ${MOJALOOP_PARTICIPANT_ID:test-participant}
  timeout: 30000

security:
  mfa:
    enabled: true
    required-for-admin: true
    backup-codes-count: 10
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-numbers: true
    require-special-chars: true
  session:
    timeout: 1800 # 30 minutes
    max-concurrent: 5
  ip-blocking:
    enabled: true
    max-failed-attempts: 5
    block-duration: 3600 # 1 hour

kyc:
  auto-verification:
    enabled: true
    max-amount: 10000 # USD
  sanctions-screening:
    enabled: true
    providers:
      - un
      - eu
      - us
  document-upload:
    max-size: 10485760 # 10MB
    allowed-types: jpg,jpeg,png,pdf

transfer:
  limits:
    daily: 50000 # USD
    monthly: 500000 # USD
    single: 10000 # USD
  fees:
    swift: 25 # USD
    mojaloop: 5 # USD
    sepa: 3 # EUR
  processing:
    batch-size: 100
    retry-attempts: 3
    retry-delay: 5000 # ms

notification:
  email:
    enabled: true
    from: ${EMAIL_FROM:noreply@banking-transfer.com}
    smtp:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
  sms:
    enabled: false
    provider: ${SMS_PROVIDER:}
    api-key: ${SMS_API_KEY:}
  webhook:
    enabled: true
    timeout: 10000 # ms

audit:
  enabled: true
  retention-days: 2555 # 7 years
  sensitive-fields:
    - password
    - token
    - secret
    - key

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600