spring:
  profiles:
    active: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banking_transfers}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  vault:
    host: ${VAULT_HOST:localhost}
    port: ${VAULT_PORT:8200}
    scheme: https
    authentication: TOKEN
    token: ${VAULT_TOKEN}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

logging:
  level:
    com.banking.transfers: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  file:
    name: /var/log/banking-transfer-platform/application.log
    max-size: 500MB
    max-history: 90

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600 # 1 hour for production
  refresh-expiration: 604800 # 7 days

keycloak:
  auth-server-url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

swift:
  enabled: ${SWIFT_ENABLED:false}
  test-mode: false
  endpoint: ${SWIFT_ENDPOINT}
  bic: ${SWIFT_BIC}
  certificate-path: ${SWIFT_CERT_PATH}
  certificate-password: ${SWIFT_CERT_PASSWORD}

mojaloop:
  enabled: ${MOJALOOP_ENABLED:false}
  test-mode: false
  endpoint: ${MOJALOOP_ENDPOINT}
  participant-id: ${MOJALOOP_PARTICIPANT_ID}

security:
  mfa:
    enabled: true
    required-for-admin: true
  ip-blocking:
    enabled: true
    max-failed-attempts: 3
    block-duration: 7200 # 2 hours

kyc:
  auto-verification:
    enabled: true
    max-amount: 5000 # USD
  sanctions-screening:
    enabled: true
    providers:
      - un
      - eu
      - us
      - ofac

transfer:
  limits:
    daily: 25000 # USD
    monthly: 250000 # USD
    single: 5000 # USD

notification:
  email:
    enabled: true
    from: ${EMAIL_FROM}
    smtp:
      host: ${SMTP_HOST}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER}
    api-key: ${SMS_API_KEY}

audit:
  enabled: true
  retention-days: 2555 # 7 years

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never