spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  redis:
    host: localhost
    port: 6379
    password: 
  kafka:
    bootstrap-servers: localhost:9092
  vault:
    host: localhost
    port: 8200
    scheme: http
    authentication: TOKEN
    token: test-token

server:
  port: 0 # Random port for tests

logging:
  level:
    com.banking.transfers: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  file:
    name: logs/test-application.log

jwt:
  secret: test-secret-key-for-testing-only
  expiration: 3600
  refresh-expiration: 86400

keycloak:
  auth-server-url: http://localhost:8081
  realm: banking-transfer-test
  client-id: banking-transfer-test-client
  client-secret: test-client-secret

swift:
  enabled: false
  test-mode: true
  endpoint: https://test.swift.com

mojaloop:
  enabled: false
  test-mode: true
  endpoint: https://test.mojaloop.io

security:
  mfa:
    enabled: false
    required-for-admin: false
  ip-blocking:
    enabled: false

kyc:
  auto-verification:
    enabled: false
  sanctions-screening:
    enabled: false

transfer:
  limits:
    daily: 1000000
    monthly: 10000000
    single: 100000

notification:
  email:
    enabled: false
  sms:
    enabled: false

audit:
  enabled: true
  retention-days: 7

cors:
  allowed-origins: http://localhost:3000,http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never