[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-payments-platform"
version = "0.1.0"
description = "International payments platform (SWIFT/IBAN)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "SQLAlchemy==2.0.31",
  "asyncpg==0.29.0",
  "alembic==1.13.2",
  "psycopg[binary,pool]==3.2.1",
  "python-jose[cryptography]==3.3.0",
  "httpx==0.27.0",
  "requests==2.32.3",
  "cryptography==43.0.0",
  "hvac==2.3.0",
  "python-stdnum==1.20",
  "prometheus-fastapi-instrumentator==7.0.0",
  "sse-starlette==2.1.3",
  "structlog==24.1.0",
  "orjson==3.10.7",
  "jinja2==3.1.4",
  "lxml==5.2.2",
  "paramiko==3.4.0"
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1 --cov=app --cov-report=xml"
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"